<style>
html,body{margin:0;height:100%;background:#0b1020;color:#fff;font-family:Fredoka,ui-rounded,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;background:linear-gradient(#4fb0ff,#dff3ff 62%,#46a86f 62%)}
form{box-sizing:border-box;width:min(86vw,340px);padding:26px 22px;border-radius:26px;text-align:center;
  background:linear-gradient(rgba(26,40,92,.94),rgba(46,26,92,.94));border:2px solid rgba(255,214,120,.7);box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{margin:0 0 4px;font-size:34px;background:linear-gradient(#fff3a8,#ffb62e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0}
p{margin:0 0 16px;opacity:.85;font-size:15px}
input[type=password]{box-sizing:border-box;width:100%;padding:12px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font:600 17px Fredoka,system-ui,sans-serif;text-align:center;outline:none}
input[type=password]:focus{border-color:#ffd84a}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0;font-size:14px;opacity:.9}
button{width:100%;padding:12px;border:0;border-radius:15px;background:linear-gradient(#ffd84a,#ff9a3d);color:#3a1d00;font:700 18px Fredoka,system-ui,sans-serif}
button:disabled{opacity:.6}
#err{min-height:20px;margin-top:10px;font-size:14px;color:#ff9a9a}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>BOB BROS</h1>
  <p>Игра закрыта паролем</p>
  <input id="pw" type="password" name="password" autocomplete="current-password" enterkeyhint="go" placeholder="Пароль" autofocus>
  <label><input id="rem" type="checkbox" checked> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Играть</button>
  <div id="err"></div>
</form>
<noscript>Для игры нужен JavaScript.</noscript>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const raw = b64(PAYLOAD), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
const $ = id => document.getElementById(id);

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, base, 256));
}
async function decryptWith(keyBytes) {
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
}
async function launch(html) {
  if (document.readyState === 'loading') await new Promise(r => addEventListener('DOMContentLoaded', r, { once: true }));
  document.open(); document.write(html); document.close();
}
function remember(keyBytes) { try { localStorage.setItem(KEY_NAME, btoa(String.fromCharCode(...keyBytes))); } catch (e) {} }
function forget() { try { localStorage.removeItem(KEY_NAME); } catch (e) {} }

(async () => {
  if (!window.crypto || !crypto.subtle) { $('err').textContent = 'Нужен безопасный адрес (https).'; $('go').disabled = true; return; }
  let saved = null;
  try { saved = localStorage.getItem(KEY_NAME); } catch (e) {}
  if (saved) {
    let html = null;
    try { html = await decryptWith(b64(saved)); } catch (e) { forget(); }
    if (html) { await launch(html); return; }
  }
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('pw').value;
    if (!pw) return;
    $('go').disabled = true; $('err').textContent = 'Проверяю…';
    try {
      const keyBytes = await deriveKey(pw);
      const html = await decryptWith(keyBytes);
      if ($('rem').checked) remember(keyBytes);
      await launch(html);
    } catch (err) {
      $('err').textContent = 'Неверный пароль';
      $('go').disabled = false; $('pw').select();
    }
  });
})();
